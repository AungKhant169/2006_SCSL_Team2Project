# Runs PathSG from the images published to GitHub Container Registry:
#
#   cp .env.example .env      # then set SECRET_KEY
#   docker compose pull
#   docker compose up -d
#
# To build the images from this checkout instead:  docker compose up -d --build
name: pathsg

services:
  server:
    image: ${IMAGE_PREFIX:-ghcr.io/aungkhant169/2006_scsl_team2project}/server:${IMAGE_TAG:-latest}
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/main.db
      SCHOOL_RAW_DIR: /data/school_raw
      # For AI roadmaps; without a key the endpoint answers 503.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Empty when unset; the server then uses its default model.
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # Rate Limits
      AI_RATE_LIMIT: ${AI_RATE_LIMIT:-10}
      AI_RATE_WINDOW: ${AI_RATE_WINDOW:-300}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-300}
      # Daily database backup, kept in /data/backups on the volume (0 hours turns it off).
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      # Security
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-${PUBLIC_ORIGIN:-http://localhost:8080}}  # Origin the browser loads the site from for the API's CORS allow-list.
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env (generate one with openssl rand -hex 32)}"
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}  # Number of proxies in front of the server. 1st hop = client nginx.
    volumes:
      - pathsg-data:/data

  client:
    image: ${IMAGE_PREFIX:-ghcr.io/aungkhant169/2006_scsl_team2project}/client:${IMAGE_TAG:-latest}
    build: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"

volumes:
  pathsg-data:
