# Runs PathSG from the images published to GitHub Container Registry:
#
#   cp .env.example .env      # then set SECRET_KEY
#   docker compose pull
#   docker compose up -d
#
# To build the images from this checkout instead:  docker compose up -d --build
name: pathsg

services:
  server:
    image: ${IMAGE_PREFIX:-ghcr.io/aungkhant169/2006_scsl_team2project}/server:${IMAGE_TAG:-latest}
    build: ./server
    restart: unless-stopped
    environment:
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env (generate one with openssl rand -hex 32)}"
      # Origin the browser loads the site from. Only used for CORS; nginx proxies /api same-origin.
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      DATABASE_URL: sqlite:////data/main.db
    volumes:
      - pathsg-data:/data

  client:
    image: ${IMAGE_PREFIX:-ghcr.io/aungkhant169/2006_scsl_team2project}/client:${IMAGE_TAG:-latest}
    build: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"

volumes:
  pathsg-data:
